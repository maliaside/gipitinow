<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>Klik Subscribe — ChatGPT Register</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0f0f1a;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    #header {
      background: #1a1a2e;
      border-bottom: 2px solid #e91e63;
      padding: 10px 14px;
      flex-shrink: 0;
    }
    #header h1 { font-size: 15px; font-weight: 700; color: #e91e63; }
    #header p  { font-size: 12px; color: #aaa; margin-top: 2px; }

    /* ── Status bar ── */
    #statusbar {
      background: #111;
      padding: 6px 14px;
      font-size: 11px;
      color: #888;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #444; flex-shrink: 0; }
    .dot.live    { background: #4caf50; animation: blink 2s infinite; }
    .dot.wait    { background: #ff9800; animation: blink 1s infinite; }
    .dot.err     { background: #f44336; }
    .dot.done    { background: #2196f3; }
    @keyframes blink { 0%,100%{opacity:1}50%{opacity:.3} }

    /* ── Screenshot container ── */
    #imgwrap {
      flex: 1;
      overflow: auto;
      -webkit-overflow-scrolling: touch;
      background: #000;
      cursor: crosshair;
      position: relative;
    }

    #screen {
      display: block;
      max-width: 100%;
      height: auto;
      touch-action: pinch-zoom;
      user-select: none;
      -webkit-user-select: none;
    }

    /* Tap ripple effect */
    .ripple {
      position: absolute;
      border-radius: 50%;
      width: 50px; height: 50px;
      background: rgba(233,30,99,.6);
      transform: translate(-50%,-50%) scale(0);
      animation: rippleAnim .5s ease-out forwards;
      pointer-events: none;
    }
    @keyframes rippleAnim {
      to { transform: translate(-50%,-50%) scale(3); opacity: 0; }
    }

    /* ── Bottom panel ── */
    #bottom {
      flex-shrink: 0;
      background: #1a1a2e;
      border-top: 1px solid #333;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    #email-box { font-size: 11px; color: #888; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #email-box strong { color: #ddd; }

    #refresh-btn {
      background: #333;
      color: #ccc;
      border: none;
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 12px;
      cursor: pointer;
      flex-shrink: 0;
    }
    #refresh-btn:active { background: #555; }

    /* ── Success/Fail overlay ── */
    #overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,.88);
      z-index: 200;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 24px;
      text-align: center;
    }
    #overlay.show { display: flex; }
    #overlay .icon { font-size: 64px; }
    #overlay h2 { font-size: 22px; font-weight: 700; }
    #overlay p  { font-size: 14px; color: #bbb; line-height: 1.6; }
    .obtn { background: #e91e63; color: #fff; border: none; padding: 12px 28px; border-radius: 10px; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 8px; }

    /* ── Loading screen ── */
    #loadscreen {
      position: fixed; inset: 0; background: #0f0f1a; z-index: 100;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
    }
    .spinner { width: 48px; height: 48px; border: 4px solid #333; border-top-color: #e91e63; border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loadscreen p { color: #aaa; font-size: 14px; }

    /* ── Tap hint toast ── */
    #taphint {
      position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
      background: rgba(233,30,99,.9); color: #fff; padding: 10px 20px;
      border-radius: 20px; font-size: 13px; font-weight: 600;
      opacity: 0; transition: opacity .3s;
      pointer-events: none; white-space: nowrap; z-index: 150;
    }
    #taphint.show { opacity: 1; }
  </style>
</head>
<body>

<div id="loadscreen">
  <div class="spinner"></div>
  <p id="ltxt">Memuat screenshot...</p>
</div>

<div id="header">
  <h1>📱 Tap untuk klik di browser bot</h1>
  <p>Gambar di bawah adalah tampilan live. Tap tombol <strong>Subscribe</strong>.</p>
</div>

<div id="statusbar">
  <div class="dot" id="dot"></div>
  <span id="stxt">Memuat...</span>
  <span id="ts" style="margin-left:auto;font-size:10px;opacity:.5"></span>
</div>

<div id="imgwrap">
  <img id="screen" src="" alt="Live screenshot" draggable="false" />
</div>

<div id="taphint" id="taphint">✅ Klik dikirim!</div>

<div id="bottom">
  <div id="email-box">Session: <strong id="email-txt">–</strong></div>
  <button id="refresh-btn" onclick="forceRefresh()">🔄 Refresh</button>
</div>

<div id="overlay" role="dialog">
  <div class="icon" id="ov-icon">⏳</div>
  <h2 id="ov-title">Menunggu...</h2>
  <p id="ov-msg">Silakan tunggu.</p>
  <button class="obtn" onclick="closeOverlay()">OK</button>
</div>

<script>
  const params   = new URLSearchParams(location.search);
  const sessionId = params.get("id");
  const API      = "/api/session/" + sessionId;

  const screen   = document.getElementById("screen");
  const dot      = document.getElementById("dot");
  const stxt     = document.getElementById("stxt");
  const ts       = document.getElementById("ts");
  const emailTxt = document.getElementById("email-txt");
  const loadscr  = document.getElementById("loadscreen");
  const ltxt     = document.getElementById("ltxt");
  const taphint  = document.getElementById("taphint");
  const imgwrap  = document.getElementById("imgwrap");
  const overlay  = document.getElementById("overlay");
  const ovIcon   = document.getElementById("ov-icon");
  const ovTitle  = document.getElementById("ov-title");
  const ovMsg    = document.getElementById("ov-msg");

  let screenshotInterval = null;
  let statusInterval     = null;
  let screenshotOk = false;
  let sessionDone  = false;
  let tapHintTimer = null;

  if (!sessionId) {
    ltxt.textContent = "❌ Session ID tidak ditemukan di URL";
    document.querySelector(".spinner").style.display = "none";
  } else {
    init();
  }

  function init() {
    fetchStatus();
    loadScreenshot();
    screenshotInterval = setInterval(loadScreenshot, 1500);
    statusInterval     = setInterval(fetchStatus, 3000);
  }

  function loadScreenshot() {
    if (sessionDone) return;
    const url = `${API}/screenshot?t=${Date.now()}`;
    const img = new Image();
    img.onload = () => {
      screen.src = img.src;
      if (!screenshotOk) {
        screenshotOk = true;
        loadscr.style.display = "none";
        dot.className = "dot live";
        stxt.textContent = "Live — tap tombol Subscribe!";
      }
      ts.textContent = new Date().toLocaleTimeString("id-ID");
    };
    img.onerror = () => {
      if (!screenshotOk) {
        ltxt.textContent = "Menunggu browser siap...";
      } else {
        dot.className = "dot wait";
        stxt.textContent = "Screenshot gagal — mencoba lagi...";
      }
    };
    img.src = url;
  }

  function forceRefresh() {
    loadScreenshot();
  }

  async function fetchStatus() {
    try {
      const r = await fetch(`${API}/status-simple`);
      if (!r.ok) return;
      const d = await r.json();
      emailTxt.textContent = d.email || sessionId;

      if (d.status === "success") {
        sessionDone = true;
        clearInterval(screenshotInterval);
        clearInterval(statusInterval);
        showOverlay("✅", "Berhasil!", `Akun ${d.email} sudah terdaftar dan berlangganan ChatGPT Business!`);
      } else if (d.status === "failed" || d.status === "cancelled") {
        sessionDone = true;
        clearInterval(screenshotInterval);
        clearInterval(statusInterval);
        showOverlay("❌", "Gagal", `Session ${d.status}. Cek log di dashboard atau coba lagi.`);
      }
    } catch { }
  }

  // ── Tap handler ──
  screen.addEventListener("click", handleTap);
  screen.addEventListener("touchend", (e) => {
    e.preventDefault();
    const t = e.changedTouches[0];
    handleTap({ clientX: t.clientX, clientY: t.clientY, currentTarget: screen });
  }, { passive: false });

  async function handleTap(e) {
    if (sessionDone) return;
    const rect = screen.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    const imgW = rect.width;
    const imgH = rect.height;

    // Visual ripple
    const rip = document.createElement("div");
    rip.className = "ripple";
    rip.style.left = x + "px";
    rip.style.top  = y + "px";
    imgwrap.appendChild(rip);
    setTimeout(() => rip.remove(), 600);

    // Show hint
    clearTimeout(tapHintTimer);
    taphint.textContent = "⏳ Mengirim klik...";
    taphint.className = "show";

    try {
      const r = await fetch(`${API}/click`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ x, y, imgW, imgH }),
      });
      const d = await r.json();
      if (d.ok) {
        taphint.textContent = `✅ Klik dikirim (${d.clickX},${d.clickY})`;
        // Refresh screenshot after a bit to see result
        setTimeout(loadScreenshot, 800);
        setTimeout(loadScreenshot, 2000);
      } else {
        taphint.textContent = "⚠️ " + (d.error || "Gagal");
      }
    } catch (err) {
      taphint.textContent = "❌ Error: " + err.message;
    }

    taphint.className = "show";
    tapHintTimer = setTimeout(() => { taphint.className = ""; }, 2500);
  }

  function showOverlay(icon, title, msg) {
    ovIcon.textContent  = icon;
    ovTitle.textContent = title;
    ovMsg.textContent   = msg;
    overlay.className   = "show";
  }
  function closeOverlay() { overlay.className = ""; }
</script>
</body>
</html>
