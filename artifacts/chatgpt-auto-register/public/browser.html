<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VNC Browser</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      background: #111;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    }

    /* ── Top bar ── */
    #topbar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 50;
      background: #1a1a2e;
      border-bottom: 2px solid #e91e63;
      padding: 7px 12px;
      display: flex; align-items: center; justify-content: space-between;
      gap: 8px; height: 42px;
    }
    #topbar .title { font-size: 13px; font-weight: 700; color: #e91e63; white-space: nowrap; }
    #topbar .hint  { font-size: 11px; color: #ccc; text-align: right; line-height: 1.3; }

    /* ── Status bar ── */
    #statusbar {
      position: fixed; top: 42px; left: 0; right: 0; z-index: 50;
      background: #222; border-bottom: 1px solid #333;
      padding: 4px 12px;
      font-size: 11px; color: #888;
      display: flex; align-items: center; gap: 6px; height: 26px;
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #444; flex-shrink: 0; }
    .dot.ok  { background: #4caf50; }
    .dot.wait{ background: #ff9800; animation: blink 1s infinite; }
    .dot.err { background: #f44336; }
    @keyframes blink { 0%,100%{opacity:1}50%{opacity:.3} }

    /* ── noVNC container ──
       scaleViewport=true: noVNC sets canvas CSS size itself for scaling.
       DO NOT force canvas width/height — it breaks noVNC coordinate mapping.
       Use overflow:auto so user can scroll if content slightly overflows. */
    #vnc-wrap {
      position: fixed;
      top: 68px; left: 0; right: 0; bottom: 0;
      overflow: auto;
      background: #000;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      /* Allow touch pan for scroll + noVNC pointer events */
      touch-action: auto;
    }

    /* ── Loading overlay ── */
    #loading {
      position: fixed; inset: 0; background: #0f0f1a; z-index: 200;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 14px;
    }
    .spinner {
      width: 48px; height: 48px;
      border: 4px solid #333; border-top-color: #e91e63;
      border-radius: 50%; animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loading p { color: #aaa; font-size: 14px; }

    /* ── Error overlay ── */
    #errbox {
      display: none;
      position: fixed; inset: 0; background: #0f0f1a; z-index: 200;
      flex-direction: column; align-items: center; justify-content: center;
      gap: 12px; padding: 24px; text-align: center;
    }
    #errbox.show { display: flex; }
    #errbox h2 { color: #f44; font-size: 18px; }
    #errbox p  { color: #aaa; font-size: 13px; line-height: 1.6; }
    .rbtn {
      background: #e91e63; color: #fff; border: none;
      padding: 12px 28px; border-radius: 10px;
      font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 8px;
    }
  </style>
</head>
<body>

<div id="topbar">
  <div class="title">🖥️ VNC Browser</div>
  <div class="hint">Cari captcha → centang<br><strong>I am human</strong></div>
</div>

<div id="statusbar">
  <div class="dot wait" id="dot"></div>
  <span id="stxt">Menghubungkan...</span>
</div>

<div id="vnc-wrap"></div>

<div id="loading">
  <div class="spinner"></div>
  <p id="ltxt">Memuat VNC...</p>
</div>

<div id="errbox">
  <h2>❌ Koneksi Gagal</h2>
  <p id="etxt">Tidak dapat terhubung ke VNC.</p>
  <button class="rbtn" onclick="location.reload()">🔄 Coba Lagi</button>
</div>

<script type="module">
  const dot     = document.getElementById("dot");
  const stxt    = document.getElementById("stxt");
  const loading = document.getElementById("loading");
  const ltxt    = document.getElementById("ltxt");
  const errbox  = document.getElementById("errbox");
  const wrap    = document.getElementById("vnc-wrap");

  ltxt.textContent = "Memuat library VNC...";

  try {
    const { default: RFB } = await import("/vnc/core/rfb.js");

    ltxt.textContent = "Menghubungkan ke browser...";

    const wsProto = location.protocol === "https:" ? "wss:" : "ws:";
    const wsUrl   = `${wsProto}//${location.host}/websockify`;

    const rfb = new RFB(wrap, wsUrl, {
      credentials: { password: "" },
      // scaleViewport: noVNC scales canvas to fit container automatically
      // and handles mouse/touch coordinate mapping internally.
      // resizeSession: false keeps remote at 900x700 — noVNC scales to fit.
      scaleViewport: true,
      resizeSession: false,
      clipViewport: false,
      showDotCursor: true,
    });

    rfb.scaleViewport = true;
    rfb.viewOnly = false;

    rfb.addEventListener("connect", () => {
      loading.style.display = "none";
      dot.className = "dot ok";
      stxt.textContent = "Terhubung ✅ — tap captcha untuk klik!";
    });

    rfb.addEventListener("disconnect", e => {
      dot.className = "dot err";
      if (e.detail?.clean) {
        stxt.textContent = "Koneksi ditutup — bot selesai";
      } else {
        stxt.textContent = "Koneksi terputus";
        errbox.querySelector("p").textContent =
          "Koneksi VNC terputus. Bot mungkin sudah selesai atau session habis.";
        errbox.classList.add("show");
      }
    });

    rfb.addEventListener("credentialsrequired", () => {
      rfb.sendCredentials({ password: "" });
    });

  } catch (err) {
    loading.style.display = "none";
    errbox.querySelector("p").textContent = "Gagal memuat VNC: " + err.message;
    errbox.classList.add("show");
    dot.className = "dot err";
    stxt.textContent = "Error";
  }
</script>

</body>
</html>
